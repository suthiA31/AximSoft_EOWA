<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        IMDB Sentiment AI
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark main-navbar">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand"
            href="{{ url_for('index') }}"
        >

            <span class="brand-icon">
                AI
            </span>

            IMDB Sentiment

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('index') }}"
                    >
                        Dashboard
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('predict') }}"
                    >
                        Prediction
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('comparison') }}"
                    >
                        Models
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('analytics') }}"
                    >
                        Analytics
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('batch') }}"
                    >
                        Batch Prediction
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<main>

    {% block content %}

    {% endblock %}

</main>


<footer class="footer">

    <div class="container">

        <div class="row">

            <div class="col-md-6">

                <h5>
                    IMDB Sentiment AI
                </h5>

                <p>
                    End-to-end deep learning
                    sentiment analysis using
                    Bi-LSTM and TensorFlow.
                </p>

            </div>


            <div class="col-md-6 text-md-end">

                <p>
                    Built with Flask •
                    TensorFlow • Bootstrap
                </p>

            </div>

        </div>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script
    src="{{ url_for('static', filename='js/dashboard.js') }}"
></script>

</body>

</html>
